<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader · October Library</title>
  <meta name="theme-color" content="#faf7f1">
  <script>
    try {
      var p = (JSON.parse(localStorage.getItem('october:v1')) || {}).prefs || {};
      var t = p.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'paper';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'paper'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/reader.css">
</head>
<body class="rd rd-loading">
  <div class="rd-dim" id="dim" aria-hidden="true"></div>
  <div class="rd-thin" aria-hidden="true"><span id="thinFill"></span></div>

  <header class="rd-bar rd-top" id="topbar">
    <div class="rd-top-left">
      <a class="rd-btn rd-back" href="./" aria-label="Back to library">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Library</span>
      </a>
    </div>
    <div class="rd-top-title">
      <span id="barTitle"></span>
      <span class="rd-top-sec" id="barSection"></span>
    </div>
    <div class="rd-tools" id="tools">
      <button class="rd-btn" id="btnToc" title="Contents (T)" aria-label="Contents">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".9" fill="currentColor"/><circle cx="4.5" cy="12" r=".9" fill="currentColor"/><circle cx="4.5" cy="18" r=".9" fill="currentColor"/></svg>
      </button>
      <button class="rd-btn" id="btnSearch" title="Search (/)" aria-label="Search in book">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <button class="rd-btn" id="btnBookmark" title="Bookmark this page (B)" aria-label="Bookmark this page" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4z"/></svg>
      </button>
      <button class="rd-btn rd-aa" id="btnAa" title="Display settings (A)" aria-label="Display settings">
        <span>A</span><span>a</span>
      </button>
      <button class="rd-btn rd-full" id="btnFull" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="rd-search" id="searchBar" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="Search in this book" autocomplete="off" aria-label="Search in this book">
    <span class="rd-search-count" id="searchCount"></span>
    <button class="rd-btn rd-sm" id="searchPrev" aria-label="Previous match"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="rd-btn rd-sm" id="searchNext" aria-label="Next match"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="rd-btn rd-sm" id="searchClose" aria-label="Close search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <main class="rd-main" id="main">
    <article class="rd-book">
      <header class="rd-titlepage" id="titlepage"></header>
      <div class="rd-content" id="content"></div>
      <footer class="rd-end" id="endmatter"></footer>
    </article>
  </main>

  <footer class="rd-bar rd-bottom" id="bottombar">
    <span class="rd-loc-sec" id="locSection"></span>
    <div class="rd-track" id="track" role="slider" tabindex="0" aria-label="Position in book" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="rd-track-rail"><div class="rd-track-fill" id="trackFill"></div></div>
      <div class="rd-ticks" id="ticks"></div>
      <span class="rd-track-tip" id="trackTip"></span>
    </div>
    <span class="rd-loc-right"><b id="locPct">0%</b><span id="locTime"></span></span>
  </footer>

  <div class="rd-scrim" id="scrim"></div>

  <aside class="rd-drawer" id="drawer" aria-label="Contents, bookmarks and highlights" aria-hidden="true">
    <div class="rd-drawer-head" id="drawerHead"></div>
    <div class="rd-tabs" role="tablist">
      <button class="rd-tab" role="tab" data-tab="toc" aria-selected="true">Contents</button>
      <button class="rd-tab" role="tab" data-tab="marks" aria-selected="false">Bookmarks <span id="markCount"></span></button>
      <button class="rd-tab" role="tab" data-tab="hls" aria-selected="false">Highlights <span id="hlCount"></span></button>
    </div>
    <div class="rd-drawer-body">
      <ol class="rd-toc" id="tocList" data-panel="toc"></ol>
      <ul class="rd-list" id="markList" data-panel="marks" hidden></ul>
      <ul class="rd-list" id="hlList" data-panel="hls" hidden></ul>
    </div>
  </aside>

  <section class="rd-panel" id="settings" aria-label="Display settings" hidden></section>

  <div class="rd-pop rd-selpop" id="selPop" hidden></div>
  <div class="rd-pop rd-notepop" id="notePop" hidden></div>
  <div class="rd-lightbox" id="lightbox" hidden></div>
  <div class="rd-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/common.js"></script>
  <script src="assets/reader.js"></script>
</body>
</html>
