<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>October Library</title>
  <meta name="description" content="A quiet reading room for my study notes.">
  <meta name="theme-color" content="#faf7f1">
  <script>
    try {
      var p = (JSON.parse(localStorage.getItem('october:v1')) || {}).prefs || {};
      var t = p.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'paper';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'paper'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/library.css">
</head>
<body class="lib">
  <header class="lib-top">
    <a class="wordmark" href="./"><em>October</em><span>Library</span></a>
    <div class="theme-menu">
      <button class="chip" id="themeBtn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <span id="themeLabel">Theme</span>
      </button>
      <div class="theme-pop" id="themePop" hidden></div>
    </div>
  </header>

  <main class="lib-main">
    <section class="hero">
      <p class="eyebrow" id="today"></p>
      <h1 id="greeting">Welcome back.</h1>
      <p class="stats" id="stats"></p>
    </section>

    <section class="continue" id="continue" hidden></section>

    <section class="shelf-wrap" aria-labelledby="shelfHead">
      <div class="section-head">
        <h2 id="shelfHead">Your shelf</h2>
        <p id="shelfCount"></p>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>

    <section class="guide" id="guide" hidden></section>
  </main>

  <footer class="lib-foot">
    <p>Your progress, highlights and bookmarks are saved in this browser only.</p>
  </footer>

  <script src="assets/common.js"></script>
  <script src="assets/library.js"></script>
</body>
</html>
