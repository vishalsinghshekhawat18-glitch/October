<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Study Desk · October Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
:root{
  --font-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#faf7f1;--surface:#fffdf9;--surface-2:#f2ede3;--ink:#24201a;--ink-2:#4a443b;--muted:#877f72;
  --line:#e5ddcf;--accent:#9b5a2c;--accent-ink:#fffaf3;--accent-soft:#f6ead9;
  --good:#4f7a4a;--good-bg:#e9f1e4;--warn:#a87414;--warn-bg:#f8eed6;--bad:#a8432f;--bad-bg:#f6e3dd;
  --radius:16px;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.top{height:76px;display:flex;align-items:center;justify-content:space-between}
.wordmark{display:inline-flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.wordmark em{font-family:var(--font-display);font-size:1.55rem;font-weight:500;letter-spacing:-.01em}
.wordmark span{font-size:.68rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:.84rem;font-weight:500;text-decoration:none}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600;min-width:112px;justify-content:center}
.hero{padding:22px 0 18px}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,4.4vw,3.1rem);line-height:1.08;letter-spacing:-.02em;margin:0}
.hero p.sub{color:var(--ink-2);margin:10px 0 0;max-width:680px}
.rooms{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:26px}
.rooms nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.rooms nav::-webkit-scrollbar{display:none}
.room-btn{flex:none;border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--ink-2);font-size:.88rem;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.room-btn:hover{background:var(--surface-2)}
.room-btn[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.room-btn .n{font-size:.7rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.room-btn .n.bad{background:var(--bad)}
.room-btn[aria-current="page"] .n{background:var(--accent-ink);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:grid;gap:22px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;min-width:0}
.card h2{font-family:var(--font-display);font-weight:500;font-size:1.28rem;margin:0;letter-spacing:-.01em}
.card h3{font-family:var(--font-display);font-weight:500;font-size:1.1rem;margin:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.8rem}
.muted{color:var(--muted)}.small{font-size:.82rem}
.empty{color:var(--muted);font-size:.9rem;padding:14px 0;border-top:1px dashed var(--line)}
.row-list{list-style:none;margin:0;padding:0}
.row-list>li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row-list>li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:.78rem;margin-top:2px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-right:4px;vertical-align:1px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.acc{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-bg);border-color:#c9dcc1;color:var(--good)}
.btn.warn{background:var(--warn-bg);border-color:#ecd9ab;color:var(--warn)}
.btn.bad{background:var(--bad-bg);border-color:#ebc6bb;color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.78rem;border-radius:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:0 4px;opacity:.55;line-height:1}
.x:hover{opacity:1;color:var(--bad)}
details.add{margin-top:14px}
details.add>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:.86rem;display:inline-block}
details.add>summary::-webkit-details-marker{display:none}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;padding:14px;background:var(--surface-2);border-radius:12px}
form.f .full{grid-column:1/-1}
form.f label{display:grid;gap:4px;font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
form.f input,form.f select,form.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:.9rem;font-weight:400;color:var(--ink);width:100%}
form.f textarea{min-height:70px;resize:vertical}
form.f .checks{display:flex;flex-wrap:wrap;gap:6px 14px}
form.f .checks label{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-2);font-weight:500;letter-spacing:0}
form.f .checks input{width:auto}
form.f .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.mit{background:var(--accent-soft);border-color:#e8d2b6;border-left:5px solid var(--accent)}
.mit .eyebrow{color:var(--accent)}
.mit .big{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;margin:4px 0 10px}
.call{border-left:5px solid var(--ink-2)}
.call.bad{border-left-color:var(--bad)}.call.warn{border-left-color:var(--warn)}.call.good{border-left-color:var(--good)}
.call .verdict{font-family:var(--font-display);font-size:1.35rem;line-height:1.25;margin:2px 0 10px}
.call ol{margin:0;padding-left:20px}.call li{margin:4px 0}
.count{display:flex;gap:14px;align-items:baseline}
.count .num{font-family:var(--font-display);font-size:3rem;line-height:1}
.signal{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.signal:first-child{border-top:0}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:6px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.strip i[data-l="1"]{background:#e8cfb6}.strip i[data-l="2"]{background:#d4a57a}.strip i[data-l="3"]{background:#b8794a}.strip i[data-l="4"]{background:var(--accent)}
.strip i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:1.4rem;font-weight:500;line-height:1.2}
.kpi span{font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}.kpi.warn b{color:var(--warn)}
.load{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:70px;margin-top:8px}
.load div{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.75}
.load-l{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.62rem;color:var(--muted);text-align:center;margin-top:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
.running{background:var(--good-bg);border-radius:10px;margin:0 -10px;padding-left:10px!important;padding-right:10px!important}
.running .timer{color:var(--good)}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.good span{background:var(--good)}.meter.bad span{background:var(--bad)}.meter.warn span{background:var(--warn)}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.exam{display:flex;flex-direction:column;gap:10px}
.exam .days{font-family:var(--font-display);font-size:2.1rem;line-height:1}
.parts{display:grid;gap:8px}
.part-row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:.8rem}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:flex;gap:14px;align-items:flex-start;padding:10px 0;position:relative}
.ladder .step{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);z-index:1}
.ladder li.done .step{background:var(--good);border-color:var(--good);color:#fff}
.ladder li.now .step{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ladder li:not(:last-child)::before{content:"";position:absolute;left:13px;top:38px;bottom:-10px;width:2px;background:var(--line)}
.track-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.track-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.track-tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table-wrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:.86rem}
.books{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.book-chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:150px}
.book-chip b{display:block;font-size:.86rem;font-weight:600}
.book-chip span{font-size:.72rem;color:var(--muted)}
.book-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tree details>summary{list-style:none;cursor:pointer}
.tree details>summary::-webkit-details-marker{display:none}
.node{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;flex-wrap:wrap}
.node:hover{background:var(--surface-2)}
.node .tw{width:14px;flex:none;color:var(--muted);font-size:.7rem;transition:transform .15s}
details[open]>summary .tw{transform:rotate(90deg)}
.node .nt{flex:1;min-width:180px;font-size:.9rem}
.lv1>.node .nt,.lv1>summary .nt{font-weight:600}
.kids{margin-left:18px;border-left:1px solid var(--line);padding-left:6px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:.92rem;margin-bottom:12px}
.letter{font-family:var(--font-display);font-size:1.04rem;line-height:1.65;white-space:pre-wrap}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.86rem;margin-bottom:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.rules{margin:0;padding-left:18px;color:var(--ink-2)}.rules li{margin:5px 0}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin:44px 0 60px;padding-top:18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.84rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.exam .card-head{flex-wrap:nowrap}.exam .card-head h3{flex:1}
@media (max-width:640px){.wrap{padding:0 16px}.books{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}.book-chip{flex:none}.top{height:64px}.card{padding:18px}.bar-row{grid-template-columns:96px 1fr 30px}.part-row{grid-template-columns:96px 1fr 40px}.row-list>li{flex-wrap:wrap}.row-list>li>.btns{width:100%;justify-content:flex-start}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="./"><em>October</em><span>Library</span></a>
    <a class="chip on" href="desk.html" aria-current="page">Desk</a>
  </header>
  <section class="hero">
    <p class="eyebrow" id="heroDate"></p>
    <h1 id="heroTitle">Study Desk</h1>
    <p class="sub" id="heroSub"></p>
  </section>
</div>
<div class="rooms"><div class="wrap"><nav id="rooms" aria-label="Desk rooms"></nav></div></div>
<main class="wrap" id="view"></main>
<div class="wrap">
  <footer class="foot">
    <span class="muted small" id="footNote"></span>
    <span class="btns">
      <button class="btn sm" data-act="sample">Fill with sample data</button>
      <button class="btn sm" data-act="export">Export</button>
      <label class="btn sm" style="cursor:pointer">Import<input type="file" id="importFile" accept="application/json" hidden></label>
      <button class="btn sm" data-act="clear">Clear all</button>
    </span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= The rules of the system ================= */
const RULES = {
  revisionGaps: [1, 2, 4], // after studying: revise on day 1, day 3, day 7 ...
  thenEvery: 10,           // ... then every 10 days, for good
  realDayMinutes: 60,      // a streak day needs at least this much recorded time
  timerCapMinutes: 180,    // one unbroken timer run longer than this is cut and flagged
  graceDeleteMinutes: 10   // deleting a task within 10 min of adding it is a typo, not a broken promise
};

/* ================= Storage ================= */
const KEY = 'october:desk:v2';
const blank = () => ({ v: 2, profile: {}, exams: [], attempts: [], milestones: [], tasks: [], units: {}, tests: [], mistakes: [], setbacks: [], notes: [], opps: [], journal: {}, log: [], sample: false });
let S = blank(), memoryOnly = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; } }

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const iso = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const fmt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const fmtLong = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const hm = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`; };
const clock = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }
function logEvent(type, text) { S.log.push({ ts: Date.now(), day: TODAY(), type, text }); }
const TRACKS = ['Banking', 'Regulatory', 'Rajasthan', 'Judiciary', 'Other'];
const STAGES = ['Preparing', 'Form filled', 'Admit card', 'Prelims done', 'Prelims cleared', 'Mains done', 'Mains cleared', 'Interview', 'Selected', 'Not cleared'];
const REASONS = { concept: 'Concept gap', silly: 'Silly mistake', time: 'Ran out of time', unstudied: 'Never studied', recall: 'Forgot / recall' };
const KINDS = { study: 'Study', revision: 'Revision', test: 'Test', practice: 'Practice', other: 'Other' };
const TEST_KINDS = { mock: 'Full mock', sectional: 'Sectional', pyq: 'Previous paper', real: 'Real exam' };

/* ================= The library: subjects stay in sync on their own ================= */
const LIVE = 'https://vishalsinghshekhawat18-glitch.github.io/October/';
const BASE = /github\.io$/.test(location.hostname) ? './' : LIVE;
const LIB = { subjects: [], series: [], outlines: {}, loading: {}, error: null, ready: false };
async function loadLibrary() {
  try {
    const r = await fetch(BASE + 'subjects.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    LIB.subjects = d.subjects.filter(s => s.status === 'ready' && s.slug !== 'guide');
    LIB.series = d.library?.series || [];
    LIB.ready = true;
    S.exams.forEach(e => examBooks(e).forEach(outline));
  } catch (e) { LIB.error = 'The library could not be reached, so subjects are not listed. Open this page with internet on, or on the site.'; }
  render();
}
const subject = slug => LIB.subjects.find(s => s.slug === slug);
const slugify = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
/* A book's headings become a tree: parts › chapters › sections › cards. Cached until the book is updated. */
async function outline(slug) {
  if (LIB.outlines[slug] || LIB.loading[slug]) return LIB.outlines[slug];
  const s = subject(slug); if (!s) return null;
  const ck = 'october:desk:outline:' + slug;
  try { const c = JSON.parse(localStorage.getItem(ck)); if (c && c.updated === s.updated) { LIB.outlines[slug] = c.nodes; return c.nodes; } } catch (e) { }
  LIB.loading[slug] = true;
  try {
    const html = await (await fetch(BASE + s.file)).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const used = new Set([...doc.querySelectorAll('[id]')].map(e => e.id));
    const heads = [...doc.querySelectorAll('h1, h2, h3, h4')].filter(h => h.textContent.trim());
    const nodes = [], stack = [];
    heads.forEach(h => {
      if (!h.id) { const b = slugify(h.textContent) || 'section'; let id = b; for (let i = 2; used.has(id); i++) id = `${b}-${i}`; h.id = id; used.add(id); }
      const lv = +h.tagName[1];
      while (stack.length && stack[stack.length - 1].lv >= lv) stack.pop();
      const n = { r: `${slug}#${h.id}`, t: (h.dataset.toc || h.textContent).replace(/\s+/g, ' ').trim(), lv, p: stack.length ? stack[stack.length - 1].i : -1, k: [] };
      const i = nodes.push(n) - 1; if (n.p >= 0) nodes[n.p].k.push(i);
      stack.push({ lv, i });
    });
    LIB.outlines[slug] = nodes;
    try { localStorage.setItem(ck, JSON.stringify({ updated: s.updated, nodes })); } catch (e) { }
  } catch (e) { LIB.outlines[slug] = []; }
  delete LIB.loading[slug];
  render();
  return LIB.outlines[slug];
}
const leafCount = (nodes, i) => nodes[i].k.length ? nodes[i].k.reduce((s, k) => s + leafCount(nodes, k), 0) : 1;

/* ================= Tasks, timers and time ================= */
const live = () => S.tasks.filter(t => !t.removed);

/* ---------- Library log ---------- */
function nodeRow(nodes, i) {
  const n = nodes[i], u = S.units[n.r];
  let st = '';
  if (u) st = u.restudy ? '<span class="tag bad">study again</span>' : u.due && u.due <= TODAY() ? '<span class="tag warn">revise now</span>' : `<span class="tag ${u.weak ? 'warn' : 'good'}">${u.weak ? 'weak · ' : ''}next ${fmt(u.due)}</span>`;
  else { let p = n.p; while (p >= 0 && !S.units[nodes[p].r]) p = nodes[p].p; if (p >= 0) st = '<span class="tag good">covered</span>'; }
  const planned = live().some(t => t.ref === n.r && !t.done && t.kind === 'study');
  return `<span class="tw">${n.k.length ? '▶' : ''}</span><span class="nt">${esc(n.t)}</span>${st}<span class="btns">${planned ? '<span class="tag acc">on today’s plan</span>' : `<button class="btn sm" data-act="plan" data-ref="${esc(n.r)}" data-i="${i}" title="Put on today’s plan with a timer">＋ Plan</button>`}<button class="btn sm" data-act="studied" data-ref="${esc(n.r)}" data-i="${i}" title="I studied this today">✓ Studied</button></span>`;
}
function renderKids(slug, nodes, idxs) {
  return idxs.map(i => {
    const n = nodes[i], cls = `lv${n.lv}`;
    if (!n.k.length) return `<div class="${cls}"><div class="node">${nodeRow(nodes, i)}</div></div>`;
    const open = ui.open.has(n.r);
    return `<details class="${cls}" data-node="${esc(n.r)}" ${open ? 'open' : ''}><summary class="node">${nodeRow(nodes, i)}</summary><div class="kids">${open ? renderKids(slug, nodes, n.k) : ''}</div></details>`;
  }).join('');
}

  let body = '<div class="empty">Reading the book’s contents…</div>';

    else if (ui.q.trim().length >= 2) {

    } else body = renderKids(slug, nodes, nodes.map((n, i) => n.p < 0 ? i : -1).filter(i => i >= 0));

    <p class="small muted" style="margin:12px 0 0"><b>＋ Plan</b> puts it on today’s plan with a timer; ticking it done logs it as studied. <b>✓ Studied</b> logs it at once. Logging a unit covers everything inside it. Either way its revisions are booked: day 1, 3, 7, then every ${RULES.thenEvery} days.</p></section>

};

const trackTabs = () => `<div class="track-tabs">${['All', ...TRACKS].map(k => `<button data-act="track" data-k="${k}" aria-pressed="${k === ui.track}">${k}</button>`).join('')}</div>`;
function ageOn(dob, day) { const a = new Date(dob + 'T00:00:00'), b = new Date(day + 'T00:00:00'); let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(); if (b.getDate() < a.getDate()) m--; if (m < 0) { y--; m += 12; } return [y, m]; }

/* ---------- Tests ---------- */
function chart(arr, e) {
  if (arr.length < 2) return '<div class="empty">Log at least two tests of this exam to see the trend.</div>';
  const W = 640, H = 210, p = 30, n = arr.length;
  const x = i => p + i * (W - 2 * p) / (n - 1), y = v => H - p - v / 100 * (H - 2 * p);
  const line = (vals, col, dash, w) => { const pts = vals.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean); return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linejoin="round"/>` : ''; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend">
    ${[0, 25, 50, 75, 100].map(v => `<line x1="${p}" x2="${W - p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join('')}
    ${line(arr.map(t => t.cutoff != null ? pct(t.cutoff, t.max) : null), 'var(--bad)', '5 4', 1.5)}${line(arr.map(t => t.topper != null ? pct(t.topper, t.max) : e && e.topper && e.max ? pct(e.topper, e.max) : null), 'var(--good)', '2 4', 1.5)}${line(arr.map(t => pct(t.score, t.max)), 'var(--accent)', '', 2.4)}
    ${arr.map((t, i) => `<circle cx="${x(i)}" cy="${y(pct(t.score, t.max))}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${esc(t.name || '')} ${fmt(t.date)}: ${t.score}/${t.max}</title></circle><text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${fmt(t.date)}</text>`).join('')}
  </svg><div class="small muted"><span style="color:var(--accent)">━</span> you &nbsp; <span style="color:var(--bad)">┅</span> cutoff &nbsp; <span style="color:var(--good)">┅</span> topper</div>`;
}

/* ================= Render ================= */
function render() {
  ensureRevisionTasks();
  nav(); hero();
  const y = scrollY;
  $('#view').innerHTML = (S.sample ? `<div class="banner"><span>Sample data, made up only to preview the design.</span><button class="btn sm" data-act="clear">Clear and start fresh</button></div>` : '')
    + (!S.profile.name && !S.exams.length && !S.sample ? '<div class="banner"><span>Empty Desk. Use <b>Import</b> at the bottom to load your private setup file. Nothing personal is stored on the site.</span></div>' : '') + (memoryOnly ? '<div class="banner">This browser is not saving data. Use Export before closing.</div>' : '') + V[room]();
  scrollTo(0, y);
}
function go(r) { room = r; history.replaceState(null, '', '#' + r); render(); scrollTo({ top: 0 }); }
setInterval(() => document.querySelectorAll('[data-timer]').forEach(el => { const t = S.tasks.find(x => x.id === el.dataset.timer); if (t && t.run) el.textContent = clock(taskMs(t)); }), 1000);

/* ================= Actions ================= */
const T = id => S.tasks.find(x => x.id === id);
function nodeInfo(ref, i) { const slug = ref.split('#')[0]; const nodes = LIB.outlines[slug]; return { slug, title: nodes[i].t, path: crumbs(nodes, +i) }; }
function completeTask(t) {
  stopTimer(t); t.done = true; t.doneAt = Date.now();
  if (!taskMs(t) && !(t.ref && readerMinutes(TODAY()) != null)) logEvent('notime', `“${t.text}” ticked done with no time recorded.`);
  if (t.date < TODAY()) logEvent('late', `“${t.text}” promised for ${fmt(t.date)}, finished ${fmt(TODAY())}.`);
  if (t.ref && t.kind === 'study') { const u = S.units[t.ref]; markStudied(t.ref, u ? u.t : t.text.replace(/^Study again: /, ''), t.book || t.ref.split('#')[0], u ? u.path : t.path, TODAY()); toast('Logged as studied. First revision tomorrow.'); }
}
document.addEventListener('click', e => {
  const rb = e.target.closest('[data-room]'); if (rb) { e.preventDefault(); return go(rb.dataset.room); }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  if (b.closest('summary')) e.preventDefault();
  const { act, id } = b.dataset; const t = id ? T(id) : null;
  if (act === 'start') { S.tasks.forEach(x => { if (x.run && x !== t) stopTimer(x); }); t.run = Date.now(); }
  else if (act === 'pause') stopTimer(t);
  else if (act === 'done') completeTask(t);
  else if (act === 'grade') gradeRevision(t, b.dataset.g);
  else if (act === 'mit') { live().forEach(x => { if (x.date <= TODAY()) x.mit = false; }); t.mit = true; }
  else if (act === 'unmit') t.mit = false;
  else if (act === 'drop') {
    const grace = Date.now() - t.created < RULES.graceDeleteMinutes * 60000 && !taskMs(t);
    if (!confirm(grace ? 'Remove this task?' : 'Drop this task? It will be recorded as a broken promise.')) return;
    stopTimer(t);
    if (grace) S.tasks = S.tasks.filter(x => x !== t);
    else { t.removed = true; t.dropped = true; logEvent('dropped', `Dropped “${t.text}” (planned for ${fmt(t.date)}).`); }
  }
  else if (act === 'book') { ui.book = b.dataset.slug; ui.q = ''; ui.open.clear(); }
  else if (act === 'plan' || act === 'studied') {
    const n = nodeInfo(b.dataset.ref, +b.dataset.i);
    if (act === 'studied') { const lc = leafCount(LIB.outlines[n.slug], +b.dataset.i); if (lc > 5 && !confirm(`This marks ${lc} cards as studied in one go. Did you really cover all of them?`)) return; if (readerMinutes(TODAY()) == null) logEvent('notime', `“${n.title}” logged as studied with no timer.`); }
    if (act === 'plan') S.tasks.push(newTask({ kind: 'study', text: n.title, ref: b.dataset.ref, book: n.slug, path: n.path, date: TODAY() }));
    else { markStudied(b.dataset.ref, n.title, n.slug, n.path, TODAY()); S.tasks.push(newTask({ kind: 'study', text: n.title, ref: b.dataset.ref, book: n.slug, path: n.path, date: TODAY(), done: true, doneAt: Date.now() })); }
    toast(act === 'plan' ? 'On today’s plan. Start the timer when you begin.' : 'Logged. First revision tomorrow.');
  }
  else if (act === 'unlog') { if (!confirm('Remove this from your study log and its revisions?')) return; delete S.units[b.dataset.ref]; S.tasks.filter(x => x.kind === 'revision' && x.ref === b.dataset.ref && !x.done).forEach(x => x.removed = true); }
  else if (act === 'del') { if (!confirm('Delete this?')) return; S[b.dataset.type] = S[b.dataset.type].filter(x => x.id !== id); }
  else if (act === 'resolve') { const m = S.mistakes.find(x => x.id === id); m.resolved = !m.resolved; }
  else if (act === 'm2task') { const m = S.mistakes.find(x => x.id === id); S.tasks.push(newTask({ kind: 'study', text: `Study again: ${m.topic}`, exam: m.exam, date: TODAY() })); toast('Added to today’s plan'); }
  else if (act === 'result') {
    const e = S.exams.find(x => x.id === id), yr = String(new Date().getFullYear());
    if (b.dataset.r === 'cleared') {
      e.stage = e.name.includes('Mains') ? 'Mains cleared' : 'Prelims cleared';
      S.attempts.push({ id: uid(), exam: e.name, track: e.track, year: yr, stage: e.name.includes('Mains') ? 'Mains' : 'Prelims', result: 'Cleared', score: null, cutoff: null, lesson: '' });
      if (e.next) { S.exams.push({ id: uid(), name: e.name.replace(/ — .*/, '') + ' — ' + e.next.name, track: e.track, date: e.next.date, stage: 'Preparing', books: e.books || [], series: e.series, note: 'Follows ' + e.name }); delete e.next; }
      toast('Logged. Next stage is on your exam list.');
    } else {
      e.stage = 'Not cleared'; delete e.next;
      S.attempts.push({ id: uid(), exam: e.name, track: e.track, year: yr, stage: e.name.includes('Mains') ? 'Mains' : 'Prelims', result: 'Not cleared', score: null, cutoff: null, lesson: 'Add the score, the cutoff and the real reason.' });
      toast('Logged. Write the real reason under Failures today.');
    }
  }
  else if (act === 'track') ui.track = b.dataset.k;
  else if (act === 'mup') { const i = S.milestones.findIndex(x => x.id === id); if (i > 0) [S.milestones[i - 1], S.milestones[i]] = [S.milestones[i], S.milestones[i - 1]]; }
  else if (act === 'o2exam') { const o = S.opps.find(x => x.id === id); S.exams.push({ id: uid(), name: o.title, track: o.track, date: '', stage: 'Preparing', books: [], note: o.org || '' }); o.status = 'applying'; toast('Added to Exams & journey'); }
  else if (act === 'sample') { if ((Object.keys(S.units).length || S.tasks.length || S.tests.length) && !confirm('Replace your data with sample data?')) return; S = sample(); }
  else if (act === 'clear') { if (!confirm('Delete everything on this Desk?')) return; S = starter(); }
  else if (act === 'export') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = `desk-backup-${TODAY()}.json`; a.click(); return; }
  else return;
  save(); render();
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details[data-node]')) return;
  const r = d.dataset.node; if (d.open === ui.open.has(r)) return;
  d.open ? ui.open.add(r) : ui.open.delete(r);
  const slug = r.split('#')[0], nodes = LIB.outlines[slug], i = nodes.findIndex(n => n.r === r), k = d.querySelector(':scope > .kids');
  if (d.open && k && !k.innerHTML) k.innerHTML = renderKids(slug, nodes, nodes[i].k);
}, true);
document.addEventListener('input', e => { if (e.target.id !== 'treeSearch') return; ui.q = e.target.value; clearTimeout(ui.qt); ui.qt = setTimeout(() => { render(); const s = $('#treeSearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 300); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile' && el.files[0]) { el.files[0].text().then(x => { try { const j = JSON.parse(x); if (j.v) { if ((S.tasks.length || Object.keys(S.units).length) && !confirm('This file is a full backup and will replace everything on this Desk. Continue?')) return; S = Object.assign(blank(), j); save(); render(); toast('Imported'); } else if (MERGE_KEYS.some(k => Array.isArray(j[k])) || j.profile) { const n = mergeUpdate(j); save(); render(); toast(n ? `${n} update${n > 1 ? 's' : ''} merged` : 'Nothing new in that file'); } else toast('Not a Desk file'); } catch (err) { toast('That file could not be read'); } el.value = ''; }); return; }
  const { act, id } = el.dataset;
  if (act === 'ostatus') S.opps.find(x => x.id === id).status = el.value;
  else if (act === 'mstatus') S.milestones.find(x => x.id === id).status = el.value;
  else if (act === 'texam') ui.testExam = el.value;
  else return;
  save(); render();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fd = new FormData(f), d = Object.fromEntries(fd), k = f.dataset.form, t = TODAY();
  const num = v => v === '' || v == null ? null : +v;
  let msg = 'Saved';
  if (k === 'task') { if ((d.date || t) < t) return toast('Tasks can’t be added to past days.'); S.tasks.push(newTask({ kind: d.kind, text: d.text, plan: num(d.plan), exam: d.exam, date: d.date || t })); }
  else if (k === 'exam' || k === 'exam-edit') {
    const o = { name: d.name, track: d.track, date: d.date, stage: d.stage, max: num(d.max), cutoff: num(d.cutoff), topper: num(d.topper), series: d.series, books: fd.getAll('books'), note: d.note };
    if (k === 'exam') S.exams.push(Object.assign({ id: uid() }, o));
    else { const ex = S.exams.find(x => x.id === f.dataset.id), old = ex.name; Object.assign(ex, o); if (old !== o.name) [S.tests, S.mistakes, S.tasks, S.setbacks].forEach(arr => arr.forEach(x => { if (x.exam === old) x.exam = o.name; })); }
    examBooks(o).forEach(outline);
  }
  else if (k === 'attempt') S.attempts.push({ id: uid(), exam: d.exam, track: d.track, year: d.year, stage: d.stage, result: d.result, score: num(d.score), cutoff: num(d.cutoff), lesson: d.lesson });
  else if (k === 'milestone') S.milestones.push({ id: uid(), title: d.title, note: d.note, status: 'next' });
  else if (k === 'test') { if (d.date > t) return toast('A test can’t be logged for a future date.'); S.tests.push({ id: uid(), exam: d.exam, kind: d.kind, name: d.name, date: d.date, score: +d.score, max: +d.max, cutoff: num(d.cutoff), topper: num(d.topper), minutes: num(d.minutes), note: d.note }); if (num(d.cutoff) != null && +d.score < +d.cutoff) msg = 'Below cutoff. Log its mistakes in the Mistake book today.'; }
  else if (k === 'mistake') S.mistakes.push({ id: uid(), topic: d.topic, exam: d.exam, reason: d.reason, date: d.date || t, source: d.source, fix: d.fix, resolved: false });
  else if (k === 'setback') S.setbacks.push({ id: uid(), date: d.date || t, what: d.what, exam: d.exam, why: d.why, cost: d.cost, rule: d.rule });
  else if (k === 'note') S.notes.push({ id: uid(), title: d.title, body: d.body, date: t });
  else if (k === 'opp') S.opps.push({ id: uid(), title: d.title, track: d.track, org: d.org, deadline: d.deadline, link: d.link, status: 'watching' });
  else if (k === 'journal') { S.journal[t] = { went: d.went, failed: d.failed }; if (d.next) { const tm = addDays(t, 1); live().forEach(x => { if (x.date === tm) x.mit = false; }); S.tasks.push(newTask({ kind: 'study', text: d.next, date: tm, mit: true })); } }
  save(); render(); toast(msg);
});

/* Updates from Claude's daily scan arrive as a private JSON file through Import; nothing is fetched from the public site.
   An item is merged when new, or re-merged when its content changed (so corrected dates do arrive). */
const MERGE_KEYS = ['tasks', 'exams', 'opps', 'notes', 'attempts', 'tests', 'mistakes', 'setbacks'];
function mergeUpdate(d) {
  S.mergedSig = S.mergedSig || {}; let n = 0; const nm = v => String(v || '').toLowerCase().trim();
  MERGE_KEYS.forEach(k => (d[k] || []).forEach(x => {
    if (!x || typeof x !== 'object') return;
    const key = k + ':' + (x.id || nm(x.name || x.title || x.text)); const clean = Object.assign({}, x); delete clean.rev;
    const sig = JSON.stringify(clean); if (S.mergedSig[key] === sig) return;
    let i = x.id ? S[k].findIndex(y => y.id === x.id) : -1;
    if (i < 0 && k === 'exams') i = S[k].findIndex(y => nm(y.name) === nm(x.name));
    if (i < 0 && k === 'opps') i = S[k].findIndex(y => nm(y.title) === nm(x.title));
    if (i >= 0) { const keep = S[k][i].id; Object.assign(S[k][i], clean, { id: keep }); }
    else S[k].push(Object.assign({ from: 'claude' }, k === 'tasks' ? newTask(clean) : Object.assign({ id: uid() }, clean)));
    S.mergedSig[key] = sig; n++;
  }));
  if (d.profile) S.profile = Object.assign(S.profile || {}, d.profile);
  return n;
}
